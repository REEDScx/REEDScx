name: Update Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: REEDScx
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate contribution graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: REEDScx
          options: bg_color=0D1117&color=FFFFFF&line=00FF41&point=00FF41&area=true&hide_border=true&custom_title=REEDS%20Contribution%20Graph&radius=8
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=REEDScx&theme=darkhub&no-frame=true&no-bg=true&column=7&margin-w=10&row=1
          path: dist/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
